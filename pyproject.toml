[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tm5-specimen-workcell-handover"
version = "0.2.0"
description = "Offline Isaac workcell, registered drawer scans and multiview pin evidence"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6", "Pillow>=10", "opencv-python>=4.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
inference = ["torch>=2.7", "torchvision", "ultralytics", "matplotlib"]

[tool.setuptools.packages.find]
include = ["workcell_kit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
